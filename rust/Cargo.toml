[package]
name = "lightningccp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "http", "cache", "utils", "builder", "chrono", "rustls_backend"] }
poise = "0.7.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio-rusqlite = "0.8.0"
fancy-regex = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rand = "0.10"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "line_series", "ab_glyph"] }
png = "0.17"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
